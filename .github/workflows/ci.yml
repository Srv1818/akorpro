# Kod sağlığı: lint, tip kontrolü, birim testleri.
#
# Eskiden `main` dalında tetikleniyordu ama böyle bir dal hiç olmadı; dosya
# aylarca hiç çalışmadı. Tetikleyici var olan dallara çevrildi (2026-09-30).
#
# Firebase işleri kaldırıldı: emülatör tabanlı entegrasyon testi, E2E,
# Lighthouse ve smoke adımları hep Firebase gizli anahtarlarına bağlıydı,
# proje Payload + Postgres'e geçtiğinden hepsi ölü koddu.
#
# İmaj derlemesi burada YOK, `deploy.yml` içinde. İkisini birden yapmak aynı
# derlemeyi iki kez çalıştırmak olurdu.
#
# E2E ve smoke testleri ayağa kalkmış bir sunucu ve veritabanı istiyor; CI'da
# ikisi de yok, o yüzden yerelde çalıştırılıyorlar (`npm run test:e2e`,
# `npm run test:smoke`).

name: CI

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  kontrol:
    name: Lint, tip, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      # Panelin özel alan bileşenleri import map'e yazılır. Derlemeden önce
      # üretilmezse tip kontrolü eksik modül görür.
      - name: Payload import map
        run: npx payload generate:importmap

      - run: npm run lint

      - name: Tip kontrolü
        run: npx tsc --noEmit

      - run: npm test

  denetim:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Bilgi amaçlı: yukarı akış paketlerindeki uyarı CI'ı kırmasın.
      - run: npm audit --audit-level=high
        continue-on-error: true

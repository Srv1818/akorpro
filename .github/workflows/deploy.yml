name: Build & Deploy (akorpro.com)

# YALNIZ Payload dalı. master / akorpro.com.tr (Vercel) bu akışın dışında.
on:
  push:
    branches: [feature/payload-migration]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=sha,format=long
            type=raw,value=staging

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Katman önbelleği Actions'ta kalır; ikinci build'den itibaren npm ci atlanır.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_GA4_ID=${{ vars.NEXT_PUBLIC_GA4_ID }}
            NEXT_PUBLIC_VITALS_ENDPOINT=${{ vars.NEXT_PUBLIC_VITALS_ENDPOINT }}
            NEXT_PUBLIC_GOOGLE_LOGIN_ENABLED=${{ vars.NEXT_PUBLIC_GOOGLE_LOGIN_ENABLED }}
            NEXT_PUBLIC_MEDIA_URL=${{ vars.NEXT_PUBLIC_MEDIA_URL }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          # Build veritabanına erişemeyebilir; erişemezse sayfalar prerender
          # edilmez ama build kırılmaz (ISR çalışma zamanında doldurur).
          secrets: |
            payload_secret=${{ secrets.PAYLOAD_SECRET }}
            database_uri=${{ secrets.DATABASE_URI }}
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

      # Deploy bilerek elle yapılıyor. Otomatik tetikleme denendi ve Coolify
      # 403 döndü: ayarlarda "Allowed API IPs" listesi var ve yalnız sabit iki
      # IP'yi kabul ediyor; GitHub Actions her çalıştırmada başka bir IP'den
      # geliyor. Liste kaldırılırsa otomatiğe dönülebilir — o zaman bu adımın
      # yerine Coolify deploy webhook'u çağrılır.
      - name: Deploy talimatı
        run: |
          {
            echo "### İmaj hazır"
            echo ""
            echo '`${{ steps.meta.outputs.tags }}`'
            echo ""
            echo "Yayına almak için Coolify'da **akorpro-payload** → Actions → Deploy."
          } >> "$GITHUB_STEP_SUMMARY"
